# Pre-commit хуки: последняя линия защиты перед коммитом.
# Используются локально установленные инструменты (language: system),
# поэтому не требуется пиновать ревизии внешних репозиториев.
# Установка: pip install pre-commit && pre-commit install
# Разовый прогон: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint + autofix)
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: golangci-lint
        name: golangci-lint (весь проект)
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false

      - id: eslint
        name: eslint (ts/js)
        entry: npx eslint
        language: system
        types_or: [javascript, tsx, ts]
        files: \.(ts|tsx|js|jsx|mjs|cjs)$

      - id: prettier
        name: prettier (формат)
        entry: npx prettier --write
        language: system
        types_or: [javascript, tsx, ts]
        files: \.(ts|tsx|js|jsx|mjs|cjs|json)$

      - id: mypy
        name: mypy (typecheck, весь проект)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
